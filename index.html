<body onload = clock() class="bg" >
  <link rel="stylesheet" type="text/css" href="./styling/style.css" />
  <div class = "topbar">
    <p class = "topbartext" style= "cursor: pointer;">MessOS</p>

    <p class="headerButton" >File</p> 


    <p class="headerButton">Edit</p>
    <p class="headerButton">View</p>
    <p class="headerButton">Go</p>
    <p class="headerButton">Window</p>
    <p class="headerButton">Help</p>

    <p class = "topbartextR" id ="dateDay"></p>
    <p class = "topbartextR" id ="dateName"></p>
    <p class = "topbartextR" id ="dateTime"></p>
  </div>

  <div id = "welcomeopen" class = "app" style="position: absolute; margin: 0;">
    <img src="./images/angelplush.jpg" style="width: 64px; height: 64px; border-radius: 16px;">
    <p class = "apptext">Welcome</p>
  </div>

  <div id = "notesopen" class = "app" style="position: absolute; margin: 0; position: relative; left: 100px;">
    <img id = "notesIcon" src="./images/notesIcon.jpg" style="width: 64px; height: 64px; border-radius: 16px;">
    <p class = "apptext">Notepad</p>
  </div>

  <div id = "spotifyopen" class = "app" style="position: absolute; margin: 0; position: relative; left: 100px;">
    <img id = "spotifyicon" src="./images/spotifyIcon.jpg" style="width: 64px; height: 64px; border-radius: 16px;">
    <p class = "apptext">Spotify</p>
  </div>

  <div class = "window" id = "welcome">
      <div class = "windowheader"> 
        <p class = "windowheadertext">Welcome</p>
        <span class = "windowheaderclose" id = "welcomeclose">&#xD7</span>
      </div>

      <div class = "windowcontent">
        <h1 style = "color: pink; filter: drop-shadow(0 0 20px rgb(185, 67, 67));">Welcome to MessOS!</h1>
        <p style="color: aqua;">The start of something great..</p>
        <img style = "height: 50%; width: 50%; border-radius: 5px;" src = "./images/angelplush.jpg"/>
      </div>
  </div>

  <div class = "window" id = "notes">
    <div class = "windowheader">
      <p class = "windowheadertext">Notepad</p>
        <span class = "windowheaderclose" id = "notesclose">&#xD7</span>
    </div>

    <div class ="windowcontent"> 
      <textarea rows="4" cols="82" id = "notesinput"></textarea>
    </div>
  </div>

  <div class = "window" id = "spotify">
    <div class = "windowheader">
      <p class = "windowheadertext">Spotify</p>
        <span class = "windowheaderclose" id = "spotifyclose">&#xD7</span>
    </div>

    <div class ="windowcontent" >
      <div class = "iframe-container">
          <div class = "iframe-overlay"></div>
          <iframe data-testid="embed-iframe" style="border-radius:12px;" src="https://open.spotify.com/embed/playlist/2pTFrWQjJoIE9TWXaBMOTi?utm_source=generator&si=ca64a2de01f1437b" width="100%" height="100%" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
      </div>
    </div>
  </div>



  <script src = "./scripts/app.js"></script>
  <script src = "./scripts/clock.js"></script>
  <script src = "./scripts/dragTMP.js"></script>

</body>
